name: Checks and native builds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always
jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"
          cache: npm
      - name: Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev
      - name: Pinned Rust
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt && rustup default 1.96.0
      - run: python3 scripts/check-release-version.py
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=1
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: python3 -m unittest discover -s scripts/tests
      - name: Notebook source parity
        run: python3 scripts/generate-notebooks.py && git diff --exit-code -- deploy/colab deploy/kaggle
  desktop:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.14.0"
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev
      - run: rustup toolchain install 1.96.0 --profile minimal && rustup default 1.96.0 && rustup target add ${{ matrix.target }}
      - run: npm ci
      - if: runner.os == 'macOS'
        run: npm run tauri:build -- --target ${{ matrix.target }}
        env:
          APPLE_SIGNING_IDENTITY: "-"
      - if: runner.os == 'Linux'
        run: npm run tauri:build -- --target ${{ matrix.target }} --config src-tauri/tauri.linux.conf.json
      - if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: node ../../node_modules/@tauri-apps/cli/tauri.js build --target ${{ matrix.target }} --config src-tauri/tauri.windows.conf.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
  agent:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            architecture: x86_64
            platform: linux
          - runner: ubuntu-22.04-arm
            architecture: aarch64
            platform: linux
          - runner: macos-15
            architecture: aarch64
            platform: macos
          - runner: macos-15-intel
            architecture: x86_64
            platform: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.96.0 --profile minimal && rustup default 1.96.0
      - run: cargo build --locked --release -p mymovie-agent -p mymovie-relay
      - name: Native agent binary smoke test
        run: target/release/mymovie-agent --help && target/release/mymovie-agent --version
      - run: python3 scripts/package-agent.py target/release/mymovie-agent release-assets --relay-binary target/release/mymovie-relay --architecture ${{ matrix.architecture }} --platform ${{ matrix.platform }} --build-os ${{ matrix.runner }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: comfyui-agent-${{ matrix.platform }}-${{ matrix.architecture }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
