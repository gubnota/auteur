stages: [verify, build, release]

workflow:
  rules:
    - if: "$CI_COMMIT_TAG"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: "$CI_COMMIT_BRANCH"

variables:
  CARGO_BUILD_JOBS: "2"
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.96.0"
  NODE_VERSION: "22.14.0"
  MACOS_RUNNER_TAG: saas-macos-medium-m1
  WINDOWS_RUNNER_TAG: windows-x64

.linux:
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config python3 libssl-dev libdbus-1-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
    - source scripts/ci-setup.sh

verify:
  extends: .linux
  stage: verify
  timeout: 45m
  script:
    - python3 scripts/check-release-version.py
    - cargo fmt --all -- --check
    - cargo test --workspace --locked
    - npm ci
    - npm run typecheck
    - npm test -- --maxWorkers=1
    - npm run build
    - npx playwright install --with-deps chromium
    - npm run test:e2e
    - python3 -m unittest discover -s scripts/tests
    - python3 scripts/generate-notebooks.py
    - git diff --exit-code -- deploy/colab deploy/kaggle

macos:
  stage: build
  needs: [verify]
  image: macos-15-xcode-16
  tags: ["$MACOS_RUNNER_TAG"]
  timeout: 1h
  parallel:
    matrix:
      - TARGET: [aarch64-apple-darwin, x86_64-apple-darwin]
  variables:
    APPLE_SIGNING_IDENTITY: "-"
  before_script:
    - source scripts/ci-setup.sh
  script:
    - rustup target add "$TARGET"
    - npm ci
    - npm run tauri:build -- --target "$TARGET"
  artifacts:
    name: "macos-$TARGET-$CI_COMMIT_REF_SLUG"
    expire_in: 14 days
    paths:
      - target/*/release/bundle/dmg/*.dmg

linux-desktop:
  extends: .linux
  stage: build
  needs: [verify]
  timeout: 1h
  parallel:
    matrix:
      - TARGET: x86_64-unknown-linux-gnu
        LINUX_RUNNER_TAG: saas-linux-small-amd64
      - TARGET: aarch64-unknown-linux-gnu
        LINUX_RUNNER_TAG: saas-linux-small-arm64
  tags: ["$LINUX_RUNNER_TAG"]
  script:
    - npm ci
    - npm run tauri:build -- --target "$TARGET" --config src-tauri/tauri.linux.conf.json
  artifacts:
    name: "linux-desktop-$TARGET-$CI_COMMIT_REF_SLUG"
    expire_in: 14 days
    paths:
      - target/*/release/bundle/deb/*.deb
      - target/*/release/bundle/appimage/*.AppImage

windows:
  stage: build
  needs: [verify]
  tags: ["$WINDOWS_RUNNER_TAG"]
  timeout: 1h
  before_script:
    - 'if ((node --version) -ne "v$env:NODE_VERSION") { throw "Install the pinned Node version on the Windows shell runner" }'
    - rustup toolchain install $env:RUST_VERSION --profile minimal
    - rustup default $env:RUST_VERSION
    - rustup target add x86_64-pc-windows-msvc
  script:
    - npm ci
    - Set-Location apps/desktop
    - node ../../node_modules/@tauri-apps/cli/tauri.js build --target x86_64-pc-windows-msvc --config src-tauri/tauri.windows.conf.json
  artifacts:
    name: "windows-x64-$CI_COMMIT_REF_SLUG"
    expire_in: 14 days
    paths:
      - target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
      - target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe

linux-agent:
  extends: .linux
  stage: build
  needs: [verify]
  timeout: 30m
  parallel:
    matrix:
      - ARCHITECTURE: x86_64
        LINUX_RUNNER_TAG: saas-linux-small-amd64
      - ARCHITECTURE: aarch64
        LINUX_RUNNER_TAG: saas-linux-small-arm64
  tags: ["$LINUX_RUNNER_TAG"]
  script:
    - cargo build --locked --release -p mymovie-agent -p mymovie-relay
    - target/release/mymovie-agent --help
    - target/release/mymovie-agent --version
    - python3 scripts/package-agent.py target/release/mymovie-agent release-assets --architecture "$ARCHITECTURE" --build-os ubuntu-22.04
  artifacts:
    name: "comfyui-agent-linux-$ARCHITECTURE-$CI_COMMIT_REF_SLUG"
    expire_in: 14 days
    paths:
      - release-assets/*

release:
  image: python:3.12-slim-bookworm
  stage: release
  needs:
    - job: macos
      artifacts: true
    - job: linux-desktop
      artifacts: true
    - job: windows
      artifacts: true
    - job: linux-agent
      artifacts: true
  resource_group: versioned-release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - python3 scripts/check-release-version.py
    - python3 scripts/gitlab-release.py
  artifacts:
    name: "release-$CI_COMMIT_TAG"
    expire_in: 30 days
    paths:
      - release-assets/*
